name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package Apple Silicon app
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check toolchain
        run: |
          test "$(uname -m)" = arm64
          swift --version
          xcodebuild -version
      - name: Run tests
        run: make test
      - name: Build and verify package
        run: make package
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/verify_release.py --arch arm64 --tag "$RELEASE_TAG"
          test -f ".github/release-notes/$RELEASE_TAG.md"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-arm64
          path: build/Tailscale-GPU-Tracker-v*-macos-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: macos-arm64
          path: dist
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          asset="dist/Tailscale-GPU-Tracker-$RELEASE_TAG-macos-arm64.zip"
          notes=".github/release-notes/$RELEASE_TAG.md"
          test -f "$asset"
          test -f "$notes"
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "Release $RELEASE_TAG is already published; refusing to replace it." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "$asset" --clobber
            gh release edit "$RELEASE_TAG" --title "Tailscale GPU Tracker $version" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" "$asset" --draft --verify-tag \
              --title "Tailscale GPU Tracker $version" --notes-file "$notes"
          fi
